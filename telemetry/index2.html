<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Sensor Dashboard</title>
    <!-- Load local Highcharts script hosted by your own Express server -->
    <script src="/libs/highcharts/highcharts.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background: #f4f7f6;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        #chart-container {
            height: 450px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #meta-info {
            text-align: center;
            margin-top: 15px;
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body style="background-color:rgb(29, 32, 32);">
    <div class="container">
        <h2 style="text-align: center; color: white;" id="device-title">ESP32 Telemetry</h2>
        <div id="chart-container"></div>
        <div id="meta-info">Last update: <span id="last-time">Never</span></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (typeof Highcharts === 'undefined') {
        console.error("Highcharts fallback failed. File could not be loaded locally.");
        return;
    }

    // Configuração global para forçar o fuso horário local do navegador
    Highcharts.setOptions({
        time: { useUTC: false }
    });

    const chart = Highcharts.chart('chart-container', {
        chart: { type: 'spline' },
        title: { text: 'Real-Time Sensor Environment' },
        xAxis: { 
            type: 'datetime',
            tickPixelInterval: 150 
        },
        yAxis: [
            { // Primary Axis: Temperature (Index 0)
                title: { text: 'Temperature (°C)', style: { color: '#FF3333' } },
                labels: { style: { color: '#FF3333' } }
            },
            { // Secondary Axis: Humidity (Index 1)
                title: { text: 'Humidity (%)', style: { color: '#3399FF' } },
                labels: { style: { color: '#3399FF' } },
                opposite: true
            },
            { // Tertiary Axis: Light (Index 2)
                title: { text: 'Light (ADC Value)', style: { color: '#FFAA00' } },
                labels: { style: { color: '#FFAA00' } },
                opposite: true,
                min: 0,
                max: 4095
            }
        ],
        series: [
            { name: 'Temperature', data: [], yAxis: 0, color: '#FF3333' },
            { name: 'Humidity', data: [], yAxis: 1, color: '#3399FF' },
            { name: 'Light', data: [], yAxis: 2, color: '#FFAA00' }
        ]
    });

    // CORREÇÃO 1: Detecta se o site roda em HTTP ou HTTPS para não quebrar o WebSocket no Apache
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(`${protocol}${window.location.host}`);

    ws.onmessage = (event) => {
        try {
            const dataReceived = JSON.parse(event.data);
            
            // O timestamp agora vem diretamente do processamento do servidor (Date.now())
            const timestamp = dataReceived.x; 
            const sensorData = dataReceived.payload; // O JSON original do ESP32 está aqui dentro

            if (sensorData.Client) {
                document.getElementById('device-title').innerText = `Live Data: ${sensorData.Client}`;
            }
            if (sensorData.Time) {
                document.getElementById('last-time').innerText = sensorData.Time;
            }

            const maxPoints = 30;

            // 1. Process Temperature & dynamic scaling
            if (sensorData.Temperature_C !== undefined) {
                const tempVal = parseFloat(sensorData.Temperature_C);
                const shift = chart.series[0].data.length > maxPoints;
                chart.series[0].addPoint([timestamp, tempVal], true, shift);
                chart.yAxis[0].setExtremes(tempVal - 5, tempVal + 5, true, false);
            }

            // 2. Process Humidity & dynamic scaling
            if (sensorData.Humidity_Percent !== undefined) {
                const humVal = parseFloat(sensorData.Humidity_Percent);
                const shift = chart.series[1].data.length > maxPoints;
                chart.series[1].addPoint([timestamp, humVal], true, shift);
                chart.yAxis[1].setExtremes(humVal - 20, humVal + 5, true, false);
            }

            // 3. Process Light
            if (sensorData.Light_ADC !== undefined) {
                const lightVal = parseInt(sensorData.Light_ADC, 10);
                const shift = chart.series[2].data.length > maxPoints;
                chart.series[2].addPoint([timestamp, lightVal], true, shift);
            }

        } catch (e) {
            console.error("Error updating graph payload:", e);
        }
    };

    ws.onopen = () => console.log('WebSocket stream online.');
    ws.onclose = () => console.log('WebSocket stream offline.');
});
</script>
</body>
</html>
